<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Muhammad Nur Faizin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">MNF</div>
        <div class="menu"> 
            <a href="#about">Tentang</a>
            <a href="#skills">Keahlian</a>
            <a href="#proyek">Proyek</a>
        </div>

        <div class="navbar-actions">
            <button id="toggleSubmenu" type="button" aria-label="Menu lainnya">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <button id="toggleTheme" type="button" aria-label="Ganti Tema">🌙</button>
        </div>
    </nav>
    <div id="subMenu" class="submenu">
        <a href="#contact">Kontak</a>
        <a href="#hubungi">Hubungi Saya</a>
    </div>

    <main>
        <section class="hero" id="home">
    <div class="hero-content">
        <div class="img-box" id="openModal">
            <div class="ring"></div>
            <img src="My Foto.jpeg" alt="Foto profil" class="profile-pic">
            <div class="hint">👆 Tap untuk memperbesar</div>
            </div>
                <div class="hero-text">
                    <h1>Muhammad Nur Faizin</h1>
                    <h2>Prodi Informatika</h2>
                </div>
            </div>
        </section>

        <section id="about" class="section">
            <div class="section-title-wrapper">
                <h2 class="section-title">Tentang Saya</h2>
            </div>
            <div class="about-text">
                <p>Kalo ditanya gw orang yang gimana? Kalo serius ya serius, kalo becanda? Hayu aja.</p>
            </div>
        </section>

        <section id="skills" class="section">
            <h2 class="section-title">Keahlian</h2>
            <div id="skill-container" class="skill-list"></div>
        </section>

        <section id="hobi" class="section">
            <h2 class="section-title">Hobi</h2>
            <div id="hobi-container" class="skill-list"></div>
        </section>

        <section id="contact" class="section">
            <h2 class="section-title">Kontak</h2>
            <div class="contact-links">
                <a href="https://www.instagram.com/finch._.f/" class="btn btn-ig" target="_blank" rel="noreferrer noopener">
                    <i class="fa-brands fa-instagram"></i> Instagram @finch._.f
                </a>
                <a href="https://wa.me/6285781205481" class="btn btn-wa" target="_blank" rel="noreferrer noopener">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                </a>
            </div>
        </section>

        <section id="proyek" class="section">
            <h2 class="section-title">Proyek</h2>
            <div id="proyek-container" class="skill-list"></div>
        </section>

        <section id="hubungi" class="section">
            <div class="contact-card">
                <div class="contact-label">Hubungi Saya</div>
                <form id="formKontak">
                    <label for="namaInput" class="sr-only">Nama</label>
                    <input id="namaInput" type="text" placeholder="Nama">
                    <label for="emailInput" class="sr-only">Email</label>
                    <input id="emailInput" type="email" placeholder="Email">
                    <label for="pesanInput" class="sr-only">Pesan</label>
                    <textarea id="pesanInput" rows="4" placeholder="Pesan..."></textarea>
                    <button type="submit">Kirim Pesan 🚀</button>
                </form>
                <div id="formMsg" class="form-msg"></div>
            </div>
        </section>

    </main>

        <div class="modal" id="modal">
            <img src="My Foto.jpeg" alt="Foto diperbesar">
        </div>

    <script type="module" src="script.js"></script>
</body>
</html>
